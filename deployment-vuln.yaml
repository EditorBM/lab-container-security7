apiVersion: apps/v1
kind: Deployment
metadata:
  name: vuln-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vuln-app
  template:
    metadata:
      labels:
        app: vuln-app
    spec:
      containers:
      - name: app
        image: vuln-app:latest
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: host-root
          mountPath: /host
      volumes:
      - name: host-root
        hostPath:
          path: /
          type: Directory
